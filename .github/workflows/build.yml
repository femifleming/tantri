name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package: Tantri-macOS.zip
          - name: Windows
            os: windows-latest
            package: Tantri-Windows.zip
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew list ninja >/dev/null 2>&1 || brew install ninja
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            cmake -B build -A x64
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target Tantri_All TantriAkasha_All TantriAkashaFX_All TantriTest TantriAkashaTest TantriAkashaFXTest

      - name: Test
        shell: bash
        run: |
          failed=0
          for t in TantriTest TantriAkashaTest TantriAkashaFXTest; do
            exe="$(find build -type f \( -name "$t" -o -name "$t.exe" \) -path "*_artefacts*" | head -n 1)"
            echo "== $t ($exe)"
            "$exe" || failed=1
          done
          exit $failed

      - name: Package
        shell: bash
        run: ci/package.sh "${{ matrix.name }}" build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
